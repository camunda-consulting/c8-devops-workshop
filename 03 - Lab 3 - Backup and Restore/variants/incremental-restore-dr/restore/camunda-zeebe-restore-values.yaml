# One-time Zeebe restore pass — layered on top of camunda-values-failover.yaml

optimize:
  enabled: false

orchestration:
  envFrom:
  - configMapRef:
      name: camunda-script-config
  env:
  - name: ZEEBE_RESTORE
    value: "true"
  - name: ZEEBE_RESTORE_FROM_BACKUP_ID
    valueFrom:
      configMapKeyRef:
        name: camunda-script-config
        key: BACKUP_ID
  - name: SPRING_PROFILES_INCLUDE
    value: "backup"
