global:
  secrets:
    autoGenerated: true
    name: camunda-credentials
  security:
    authentication:
      method: oidc
  identity:
    auth:
      enabled: true
      publicIssuerUrl: http://localhost:18080/auth/realms/camunda-platform
      optimize:
        redirectUrl: http://localhost:8083
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-optimize-client-token
      orchestration:
        redirectUrl: http://localhost:8080
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token

connectors:
  enabled: false

orchestration:
  enabled: true
  security:
    authentication:
      oidc:
        redirectUrl: http://localhost:8080
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token
      unprotectedApi: true
    authorizations:
      enabled: false
  env:
  - name: SPRING_PROFILES_INCLUDE
    value: "backup"
  extraConfiguration:
    application-backup.yaml: |
      camunda:
        data:
          backup:
            repository-name: "camunda-backup"

      zeebe:
        broker:
          data:
            backup:
              enabled: true
              store: S3
              s3:
                bucketName: camunda
                forcePathStyleAccess: true
                endpoint: http://minio:9000
                accessKey: minioadmin
                secretKey: minioadmin
                region: us-east-1
                basePath: zeebe

identity:
  enabled: true
  firstUser:
    enabled: true
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-firstuser-password

identityKeycloak:
  enabled: true
  postgresql:
    auth:
      existingSecret: camunda-credentials
      secretKeys:
        adminPasswordKey: identity-keycloak-postgresql-admin-password
        userPasswordKey: identity-keycloak-postgresql-user-password
  auth:
    existingSecret: camunda-credentials
    passwordSecretKey: identity-keycloak-admin-password

optimize:
  enabled: true
  migration:
    enabled: false
  env:
  - name: CAMUNDA_OPTIMIZE_BACKUP_REPOSITORY_NAME
    value: "optimize-backup"

elasticsearch:
  enabled: true
  master:
    masterOnly: false
    replicaCount: 1
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0
  image:
    repository: bitnamilegacy/elasticsearch
    tag: 8.18.0
  global:
   kibanaEnabled: true
  kibana:
    image:
      repository: bitnamilegacy/kibana
      tag: 8.18.0 
    readinessProbe:
      enabled: false
  initScripts:
    init-keystore.sh: |
      #!/bin/bash
      set -e

      echo "Adding S3 access keys to Elasticsearch keystore..."

      # Add S3 client default keys to the keystore
      echo "$S3_SECRET_KEY" | elasticsearch-keystore add -f -x s3.client.default.secret_key
      echo "$S3_ACCESS_KEY" | elasticsearch-keystore add -f -x s3.client.default.access_key
  extraEnvVars:
  - name: S3_SECRET_KEY
    value: minioadmin
  - name: S3_ACCESS_KEY
    value: minioadmin
