# Shared script config used by every job in this workshop (backup, snapshot
# repository registration, DR warm-restore, failover restore).
#

apiVersion: v1
kind: ConfigMap
metadata:
  name: camunda-script-config
  labels:
    type: camunda-backup-restore
data:
  CAMUNDA_RELEASE_NAME: camunda                              # Name of the Camunda helm release
  ES_MAIN_ENDPOINT: es-main-master.es-main-dr.svc.cluster.local:9200  # "Main" ES — actively used by Camunda
  ES_DR_ENDPOINT: es-dr-master.es-main-dr.svc.cluster.local:9200      # "DR" ES — cold-provisioned, warmed via restores only
  MINIO_ENDPOINT: http://minio.minio.svc.cluster.local:9000   # Shared MinIO endpoint (S3 API)
  MINIO_BUCKET: camunda                    # MinIO bucket used for all snapshot repositories + Zeebe backups

  ORCHESTRATION_BACKUP_REPOSITORY: orchestration-backup
  OPTIMIZE_BACKUP_REPOSITORY: optimize-backup

  ELASTIC_ZEEBE_RECORDS_SNAPSHOT_REPOSITORY: zeebe-records-backup

  SNAPSHOT_REPOSITORIES: "orchestration-backup optimize-backup zeebe-records-backup"
  BACKUP_ID: "REPLACE_IT"                  # backup #2 — restoring this onto es-dr, which already has backup #1's data
