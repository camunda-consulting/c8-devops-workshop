# Load generator: https://github.com/camunda-community-hub/camunda-8-benchmark
# Reused as-is from the Lab 3 pattern — runs inside camunda-test itself, so
# camunda-zeebe-gateway:26500 resolves without namespace qualification.
# `plaintext=true` matches orchestration.security.authentication.unprotectedApi
# in camunda-values.yaml (no auth to configure a client for).
#
# Deploy with:
#   kubectl create configmap payload --from-file=./backup/payload.json -n camunda-test
#   kubectl label configmap payload type=camunda-backup-restore -n camunda-test
#   kubectl apply -f ./backup/benchmark.yaml -n camunda-test

apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark
  labels:
    app: benchmark
    type: camunda-backup-restore
spec:
  selector:
    matchLabels:
      app: benchmark
  replicas: 1
  template:
    metadata:
      labels:
        app: benchmark
    spec:
      containers:
      - name: benchmark
        image: berndruecker/camunda-8-benchmark:main
        imagePullPolicy: Always
        env:
          - name: JAVA_OPTIONS
            value: >-
              -Dzeebe.client.broker.gateway-address=camunda-zeebe-gateway:26500
              -Dzeebe.client.security.plaintext=true
              -Dzeebe.client.request-timeout=600s
              -Dzeebe.client.job.poll-interval=100ms
              -Dzeebe.client.worker.max-jobs-active=200
              -Dbenchmark.startPiPerSecond=5
              -Dbenchmark.maxBackpressurePercentage=1.0
              -Dbenchmark.taskCompletionDelay=10
              -Dbenchmark.bpmnProcessId=BenchmarkProcess
              -Dbenchmark.jobType=benchmark-task
              -Dbenchmark.multipleJobTypes=8
              -Dbenchmark.payloadPath=file:/payload.json
              -Dbenchmark.autoDeployProcess=false
              -Dbenchmark.warmupPhaseDurationMillis=3000
              -Dbenchmark.startRateAdjustmentStrategy=backpressure
              -Dbenchmark.startPiIncreaseFactor=0.1
        resources:
          limits:
            cpu: 1
            memory: 4Gi
          requests:
            cpu: 1
            memory: 4Gi
        volumeMounts:
        - name: payload
          mountPath: payload.json
          subPath: payload.json
          readOnly: true
      volumes:
      - name: payload
        configMap:
          name: payload
