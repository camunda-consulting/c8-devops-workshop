global:
  secrets:
    autoGenerated: true
    name: camunda-credentials

  security:
    authentication:
      method: oidc

  ingress:
    enabled: false

  identity:
    auth:
      enabled: true
      type: KEYCLOAK

      issuerBackendUrl: http://camunda-keycloak:18080/auth/realms/camunda-platform
      issuer: http://camunda-keycloak:18080/auth/realms/camunda-platform
      publicIssuerUrl: http://camunda-keycloak:18080/auth/realms/camunda-platform

      identity:
        redirectUrl: http://localhost:8084

      optimize:
        redirectUrl: http://localhost:8083
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-optimize-client-token
  elasticsearch:
      enabled: true

connectors:
  enabled: false

orchestration:
  security:
    initialization:   
      defaultRoles:
        admin:
          users:
          - admin
    authentication:
      oidc:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token
        redirectUrl: http://localhost:8080
      unprotectedApi: true
    authorizations:
      enabled: false
  env:
  - name: SPRING_PROFILES_INCLUDE
    value: "backup"
  extraConfiguration:
    application-backup.yaml: |
      camunda:
        data:
          backup:
            repository-name: "camunda-backup"

      zeebe:
        broker:
          data:
            backup:
              enabled: true
              store: S3
              s3:
                bucketName: camunda
                forcePathStyleAccess: true
                endpoint: http://minio:9000
                accessKey: minioadmin
                secretKey: minioadmin
                region: us-east-1
                basePath: zeebe

identity:
  enabled: true
  fullURL: http://localhost:8084
  logging.level.io.camunda.identity: DEBUG
  firstUser:
    enabled: true
    username: admin
    email: admin@camunda.local
    firstName: Admin
    lastName: User
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-firstuser-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

identityKeycloak:
  enabled: true
  extraEnvVars:
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: 'true'
  - name: KC_HOSTNAME
    value: http://camunda-keycloak:18080/auth
  ports:
    http: 18080
  service:
    ports:
      http: 18080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

optimize:
  enabled: true
  migration:
    enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
  - name: CAMUNDA_OPTIMIZE_BACKUP_REPOSITORY_NAME
    value: "optimize-backup"

elasticsearch:
  master:
    masterOnly: false
    replicaCount: 1
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0
  image:
    repository: bitnamilegacy/elasticsearch
    tag: 8.18.0
  global:
   kibanaEnabled: true
  kibana:
    image:
      repository: bitnamilegacy/kibana
      tag: 8.18.0 
    readinessProbe:
      enabled: false
  initScripts:
    init-keystore.sh: |
      #!/bin/bash
      set -e

      echo "Adding S3 access keys to Elasticsearch keystore..."

      # Add S3 client default keys to the keystore
      echo "$S3_SECRET_KEY" | elasticsearch-keystore add -f -x s3.client.default.secret_key
      echo "$S3_ACCESS_KEY" | elasticsearch-keystore add -f -x s3.client.default.access_key
  extraEnvVars:
  - name: S3_SECRET_KEY
    value: minioadmin
  - name: S3_ACCESS_KEY
    value: minioadmin
